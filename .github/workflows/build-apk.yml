name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK for Release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk CalderaCastaway-debug.apk

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CalderaCastaway-debug-apk
          path: CalderaCastaway-debug.apk

      - name: Publish to Latest APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Caldera Castaway (Latest APK)
          body: Automated debug APK build from the latest GitHub push. Tap CalderaCastaway-debug.apk below to download and install on Android.
          files: CalderaCastaway-debug.apk
          prerelease: false
          make_latest: true
